<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFrame - The Premium Frontend Framework</title>
    
    <!-- CSS Base -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/scrollbars.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/typography.css">
    <link rel="stylesheet" href="src/css/utilities.css">
    <link rel="stylesheet" href="src/css/components/forms.css">
    <link rel="stylesheet" href="src/css/components/navbar.css">
    
    <style>
        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.05), transparent 40%);
        }
        
        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--of-text-muted);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-inline: auto;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="of-navbar">
        <a href="#" class="of-navbar-brand" style="margin: 0;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 0.5rem; display: inline-block; vertical-align: middle;">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            OmniFrame v1.2
        </a>
        <div class="of-navbar-collapse" style="justify-content: flex-end;">
            <button id="toggleTheme" class="of-btn of-btn-ghost" style="border-radius: var(--of-radius-full);">🌙</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">
                Zero Dependências.<br>
                <span class="of-text-primary">100% Performance.</span>
            </h1>
            <p class="hero-subtitle">
                O framework frontend premium construído em Vanilla JS. Acessível, modular, desenhado para sistemas corporativos e dashboards complexos.
            </p>
            <div class="hero-actions">
                <a href="playground/index.html" class="of-btn of-btn-primary of-btn-lg of-btn-3d">
                    Acessar o Playground
                </a>
                <a href="https://github.com/eltpmoc/omniframe" target="_blank" class="of-btn of-btn-secondary of-btn-lg">
                    Ver no GitHub
                </a>
            </div>
            
            <div class="theme-customizer" style="margin-top: 3rem; background: var(--of-bg-surface); padding: 1.5rem; border-radius: var(--of-radius-lg); box-shadow: var(--of-shadow-md); display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: flex-end; border: 1px solid var(--of-border-color);">
                <div class="of-form-group" style="margin-bottom: 0; text-align: left;">
                    <label class="of-label" style="font-size: 0.75rem;">Cor Primária</label>
                    <input type="color" id="colorPrimary" class="of-input" value="#4f46e5" style="padding: 0; width: 3rem; height: 2.5rem; border: none; cursor: pointer;">
                </div>
                <div class="of-form-group" style="margin-bottom: 0; text-align: left;">
                    <label class="of-label" style="font-size: 0.75rem;">Secundária</label>
                    <input type="color" id="colorSecondary" class="of-input" value="#8b5cf6" style="padding: 0; width: 3rem; height: 2.5rem; border: none; cursor: pointer;">
                </div>
                <div class="of-form-group" style="margin-bottom: 0; text-align: left;">
                    <label class="of-label" style="font-size: 0.75rem;">Bordas</label>
                    <input type="color" id="colorBorder" class="of-input" value="#e2e8f0" style="padding: 0; width: 3rem; height: 2.5rem; border: none; cursor: pointer;">
                </div>
                <div class="of-form-group" style="margin-bottom: 0; text-align: left; width: 5rem;">
                    <label class="of-label" style="font-size: 0.75rem;">Tamanho</label>
                    <input type="number" id="inputFontSize" class="of-input" value="16" style="height: 2.5rem; padding: 0.25rem 0.5rem; text-align: center;">
                </div>
                <div class="of-form-group" style="margin-bottom: 0; text-align: left; width: 10rem;">
                    <label class="of-label" style="font-size: 0.75rem;">Fonte</label>
                    <select id="selectFont" class="of-select" style="height: 2.5rem; padding: 0.25rem 0.5rem; font-size: 0.85rem;">
                        <option value="'Inter', system-ui, sans-serif">Inter (Padrão)</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Comic Sans MS', cursive">Comic Sans</option>
                        <option value="monospace">Monospace</option>
                    </select>
                </div>
                <button id="btnApplyTheme" class="of-btn of-btn-primary of-btn-3d" style="height: 2.5rem; padding: 0 1rem; font-size: 0.85rem;">Aplicar Tema</button>
                <button id="btnResetTheme" class="of-btn of-btn-ghost" style="height: 2.5rem; padding: 0 1rem; font-size: 0.85rem;">Restaurar</button>
            </div>
            
            <div style="margin-top: 4rem; color: var(--of-text-muted); font-size: 0.9rem;">
                <p>Para ler a documentação, navegue pela pasta <code>/docs</code> no repositório.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('toggleTheme').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('toggleTheme').innerHTML = newTheme === 'dark' ? '☀️' : '🌙';
        });
    </script>
    <script type="module">
        import { Config } from './src/js/omniframe.js';

        // Atualiza as cores em tempo real enquanto arrasta o color picker
        const inputs = ['colorPrimary', 'colorSecondary', 'colorBorder', 'inputFontSize', 'selectFont'];
        
        document.getElementById('btnApplyTheme').addEventListener('click', () => {
            applyCurrentTheme();
        });

        function applyCurrentTheme() {
            Config.setTheme({
                primaryColor: document.getElementById('colorPrimary').value,
                secondaryColor: document.getElementById('colorSecondary').value,
                borderColor: document.getElementById('colorBorder').value,
                fontSize: document.getElementById('inputFontSize').value + 'px',
                fontFamily: document.getElementById('selectFont').value
            });
        }

        // Permitir atualização em tempo real se o usuário quiser (opcional)
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('change', applyCurrentTheme);
        });

        document.getElementById('btnResetTheme').addEventListener('click', () => {
            Config.resetTheme();
            // Resetar inputs para valores originais
            document.getElementById('colorPrimary').value = '#4f46e5';
            document.getElementById('colorSecondary').value = '#8b5cf6';
            document.getElementById('colorBorder').value = '#e2e8f0';
            document.getElementById('inputFontSize').value = '16';
            document.getElementById('selectFont').value = "'Inter', system-ui, sans-serif";
        });
    </script>
</body>
</html>
