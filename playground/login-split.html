<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniFrame - Login Split Screen</title>
    <!-- CSS Base -->
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/components/forms.css">
    <link rel="stylesheet" href="../src/css/components/login.css">
    <link rel="stylesheet" href="../src/css/components/modal.css"> <!-- Para os botões of-btn -->
    <style>
        /* Apenas para o botão fixo flutuante de testes (Theme Toggle) */
        .theme-float { position: fixed; bottom: 1rem; right: 1rem; z-index: 100; }
    </style>
</head>
<body style="margin: 0;">

    <button class="of-btn of-btn-primary theme-float" id="toggleTheme">Dark Mode (Toggle)</button>

    <div class="of-login-wrapper of-login-split">
        
        <!-- Esquerda (Imagem) -->
        <div class="of-login-split-image" style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1200&q=80');">
            <!-- Espaço para um quote criativo ou arte da empresa -->
        </div>

        <!-- Direita (Formulário) -->
        <div class="of-login-split-form">
            <div class="of-login-split-form-inner">
                
                <div class="of-login-header" style="text-align: left;">
                    <h1>Bem-vindo de volta! 👋</h1>
                    <p>Por favor, insira seus dados para continuar.</p>
                </div>

                <div class="of-form-group">
                    <label class="of-label">E-mail corporativo</label>
                    <input type="email" class="of-input" placeholder="seu.nome@empresa.com">
                </div>

                <div class="of-form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label class="of-label" style="margin-bottom: 0;">Senha</label>
                        <a href="#" style="font-size: 0.875rem; color: var(--of-primary); text-decoration: none;">Esqueci a senha</a>
                    </div>
                    <input type="password" class="of-input" placeholder="••••••••">
                </div>

                <label class="of-check-group" style="margin-bottom: 1.5rem;">
                    <input type="checkbox" class="of-checkbox">
                    <span style="font-size: 0.875rem; color: var(--of-text-muted);">Mantenha-me conectado</span>
                </label>

                <button class="of-btn of-btn-primary of-btn-lg" style="width: 100%;">Entrar na Plataforma</button>

                <div class="of-login-divider">ou entre com</div>

                <button class="of-btn of-btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>

            </div>
        </div>

    </div>

    <script>
        document.getElementById('toggleTheme').addEventListener('click', () => {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        });
    </script>
</body>
</html>
